name: creatormind-oci

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.oci}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.oci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.oci}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  app:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.production
    image: creatormind-api:oci
    restart: unless-stopped
    init: true
    env_file: [.env.oci]
    environment:
      POSTBRIDGE_ENV: production
      PORT: "8000"
    expose: ["8000"]
    volumes:
      - ./backups:/backups
      - ${OCI_PRIVATE_KEY_HOST_PATH:-./deploy/oci/empty-oci-key}:/run/secrets/oci_api_key.pem:ro
      - ${OCI_CONFIG_HOST_PATH:-./deploy/oci/empty-oci-config}:/run/secrets/oci_config:ro
    networks: [proxy, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': os.environ['POSTBRIDGE_API_DOMAIN']}); urllib.request.urlopen(request, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  tracking-worker:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.production
    image: creatormind-api:oci
    restart: unless-stopped
    init: true
    env_file: [.env.oci]
    environment:
      POSTBRIDGE_ENV: production
      POSTBRIDGE_RUN_MIGRATIONS: "false"
    command: ["python", "-m", "backend.tracking_worker", "run", "--poll-seconds", "${POSTBRIDGE_TRACKING_POLL_SECONDS:-3600}"]
    volumes:
      - ${OCI_PRIVATE_KEY_HOST_PATH:-./deploy/oci/empty-oci-key}:/run/secrets/oci_api_key.pem:ro
      - ${OCI_CONFIG_HOST_PATH:-./deploy/oci/empty-oci-config}:/run/secrets/oci_config:ro
    networks: [proxy, data]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "backend.tracking_worker", "healthcheck", "--max-age-seconds", "7200"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging

  frontend:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${POSTBRIDGE_PUBLIC_API_URL:?set POSTBRIDGE_PUBLIC_API_URL in .env.oci}
    image: postbridge-web:oci
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose: ["3000"]
    networks: [proxy]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dashboard').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oci/nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    environment:
      NGINX_WEB_SERVER_NAME: ${POSTBRIDGE_WEB_DOMAIN:?set POSTBRIDGE_WEB_DOMAIN in .env.oci}
      NGINX_WWW_SERVER_NAME: ${POSTBRIDGE_WWW_DOMAIN:?set POSTBRIDGE_WWW_DOMAIN in .env.oci}
      NGINX_API_SERVER_NAME: ${POSTBRIDGE_API_DOMAIN:?set POSTBRIDGE_API_DOMAIN in .env.oci}
      NGINX_CERTIFICATE_NAME: ${POSTBRIDGE_WEB_DOMAIN:?set POSTBRIDGE_WEB_DOMAIN in .env.oci}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
    networks: [proxy]
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    profiles: [certbot]
    ports:
      - "80:80"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  certbot_www:
  letsencrypt:

networks:
  # This network must permit egress because the API calls OCI, Meta, and Google.
  # It remains private from the host because only nginx publishes ports.
  proxy:
  data:
    internal: true
